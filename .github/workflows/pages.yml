# Публикация книги на GitHub Pages.
#
# Источник — папка docs/. Один workflow на всё: соберёт статику и выложит её
# как артефакт Pages. Раньше в репозитории лежали три workflow одновременно
# (pages.yml, static.yml и шаблон Jekyll), они мешали друг другу, а режим
# Pages стоял «Deploy from a branch → /», где в корне нет index.html:
# открывался README репозитория. Отсюда и «pages не отображается».
name: Deploy book to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Проверяем, что книга вообще собирается и проходит тесты.
      # Если контент сломан — публикации не будет, а не «тихо пустая страница».
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Build content
        run: npm run build:content
      - name: Test
        run: npm test

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload book
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
